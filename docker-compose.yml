services:
  api:
    build: .
    image: trust-layer
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - hf_cache:/app/.hf
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  ui:
    image: trust-layer
    command: streamlit run app/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy

volumes:
  hf_cache: